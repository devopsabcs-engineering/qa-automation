# CI for the Ontario Common Service Centre demo: build, run xUnit tests,
# Playwright UI tests, and publish test results and code coverage. Mirrors
# the Build stage of .azuredevops/pipelines/ci-cd.yml (deployment omitted).

name: CI

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - playwright-tests/**
      - .github/workflows/ci.yml
      - global.json
      - OntarioCsc.slnx
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release
  SOLUTION: OntarioCsc.slnx
  TEST_PROJECT: tests/OntarioCsc.Web.Tests/OntarioCsc.Web.Tests.csproj
  TEST_RESULTS_DIR: ${{ github.workspace }}/TestResults
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build solution and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore NuGet packages
        run: dotnet restore "$SOLUTION"

      - name: Build solution (${{ env.BUILD_CONFIGURATION }})
        run: dotnet build "$SOLUTION" --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Run xUnit tests + collect coverage
        run: >-
          dotnet test "$TEST_PROJECT"
          --configuration "$BUILD_CONFIGURATION"
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "$TEST_RESULTS_DIR"
          --collect "XPlat Code Coverage"

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: xUnit tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Generate code coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub

      - name: Add coverage summary to job summary
        if: ${{ !cancelled() }}
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport
          retention-days: 14

  ui-tests:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: playwright-tests
    env:
      E2E_CONFIGURATION: Release
      E2E_NO_BUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-tests/package-lock.json

      - name: Build web app (${{ env.BUILD_CONFIGURATION }})
        working-directory: .
        run: dotnet build src/OntarioCsc.Web/OntarioCsc.Web.csproj --configuration "$BUILD_CONFIGURATION"

      - name: Install npm packages
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright starts the app itself via the webServer block in playwright.config.ts.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Publish Playwright test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Playwright UI tests
          path: playwright-tests/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-tests/playwright-report
            playwright-tests/test-results
          retention-days: 14
