# CI for the Ontario Common Service Centre demo: build, run xUnit tests,
# publish test results and code coverage. Mirrors the Build stage of
# .azuredevops/pipelines/ci-cd.yml (deployment intentionally omitted).

name: CI

on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - .github/workflows/ci.yml
      - global.json
      - OntarioCsc.slnx
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release
  SOLUTION: OntarioCsc.slnx
  TEST_PROJECT: tests/OntarioCsc.Web.Tests/OntarioCsc.Web.Tests.csproj
  TEST_RESULTS_DIR: ${{ github.workspace }}/TestResults
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build solution and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore NuGet packages
        run: dotnet restore "$SOLUTION"

      - name: Build solution (${{ env.BUILD_CONFIGURATION }})
        run: dotnet build "$SOLUTION" --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Run xUnit tests + collect coverage
        run: >-
          dotnet test "$TEST_PROJECT"
          --configuration "$BUILD_CONFIGURATION"
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "$TEST_RESULTS_DIR"
          --collect "XPlat Code Coverage"

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: xUnit tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Generate code coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub

      - name: Add coverage summary to job summary
        if: ${{ !cancelled() }}
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport
          retention-days: 14
