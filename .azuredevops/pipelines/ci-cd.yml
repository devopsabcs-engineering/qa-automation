# =====================================================================
# Azure DevOps pipeline — Ontario Common Service Centre workshop demo
# ---------------------------------------------------------------------
# Stage 1: Build the ASP.NET Core 10 solution.
# Stage 2: Run xUnit tests, publish results to the ADO "Tests" tab,
#          and publish code coverage to the "Code Coverage" tab.
# Stage 3: Publish the web app as a build artifact.
# Stage 4: Provision the App Service via Bicep (idempotent) and deploy
#          the published artifact to it.
#
# Prereqs for the Deploy stage:
#   1. An Azure Resource Manager service connection named by
#      `azureServiceConnection` exists in the ADO project.
#   2. The service principal behind it has Contributor on the target
#      resource group (or subscription).
#
# When unit tests run via `dotnet test`, .trx results are produced and
# automatically picked up by the DotNetCoreCLI@2 task. Once a Playwright
# project is added (see README.md), append a PublishTestResults@2 step
# pointing at its JUnit XML output to surface those results in the same
# Tests tab.
# =====================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - tests/**
      - infra/**
      - .azuredevops/pipelines/ci-cd.yml
      - global.json
      - OntarioCsc.slnx

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.0.x'
  solution: 'OntarioCsc.slnx'
  webProject: 'src/OntarioCsc.Web/OntarioCsc.Web.csproj'
  testProject: 'tests/OntarioCsc.Web.Tests/OntarioCsc.Web.Tests.csproj'
  # Azure deployment target. Override at the pipeline level (not here)
  # if any value differs between environments.
  azureServiceConnection: 'sc-ontario-csc'
  azureLocation: 'canadacentral'
  appServiceName: 'app-ontario-csc-dev-cac'
  appServiceResourceGroup: 'rg-ontario-csc-dev-cac'

stages:
  - stage: Build
    displayName: Build & Test
    jobs:
      - job: BuildAndTest
        displayName: Build solution and run tests
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: '$(solution)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run xUnit tests + collect coverage'
            inputs:
              command: 'test'
              projects: '$(testProject)'
              # `publishTestResults: true` makes the task append its own
              # `--logger trx --results-directory <agent-temp>/<guid>` and
              # auto-publishes the .trx files to the Azure DevOps Tests tab.
              # We only add `--collect` for code coverage; coverage XML lands
              # next to the .trx in the same results directory.
              arguments: '--configuration $(buildConfiguration) --no-build --collect "XPlat Code Coverage"'
              publishTestResults: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

          - task: DotNetCoreCLI@2
            displayName: 'Publish web app'
            inputs:
              command: 'publish'
              projects: '$(webProject)'
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --output $(Build.ArtifactStagingDirectory)/web
              publishWebProjects: false
              zipAfterPublish: true
              modifyOutputPath: false

          - task: PublishPipelineArtifact@1
            displayName: 'Publish web artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/web'
              artifact: 'web'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish infra (Bicep) artifact'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/infra'
              artifact: 'infra'
              publishLocation: 'pipeline'

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        displayName: Provision infra and deploy web app
        environment: 'ontario-csc-dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: web

                - download: current
                  artifact: infra

                - task: AzureCLI@2
                  displayName: 'Provision App Service via Bicep'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'pscore'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az group create `
                        --name "$(appServiceResourceGroup)" `
                        --location "$(azureLocation)" `
                        --output none

                      az deployment group create `
                        --resource-group "$(appServiceResourceGroup)" `
                        --template-file "$(Pipeline.Workspace)/infra/main.bicep" `
                        --parameters appServiceName="$(appServiceName)" location="$(azureLocation)" `
                        --output none

                - task: AzureWebApp@1
                  displayName: 'Deploy to App Service'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(appServiceName)'
                    resourceGroupName: '$(appServiceResourceGroup)'
                    package: '$(Pipeline.Workspace)/web/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'
